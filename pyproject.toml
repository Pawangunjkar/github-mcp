[project]
name = "github-mcp"
version = "1.0.0"
description = "MCP server for GitHub operations — 73 tools for repos, PRs, issues, actions, releases, search, and more"
requires-python = ">=3.10"
authors = [
    { name = "Pawan Gunjkar", email = "pawangunjkar@gamil.com" }
]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
